name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ONNX Runtime (text recognition in the client) only needs the CPU files, no CUDA packages from NuGet.
env:
  ONNXRUNTIME_NODE_INSTALL: skip

jobs:
  checks:
    name: Typecheck, lint, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npm run server:bundle

  e2e:
    name: Browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: playwright-results
          path: test-results
          retention-days: 7

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: replayhaven:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the container
        run: |
          set -euo pipefail
          TOKEN=ci-smoke-test-token-with-32-characters
          docker run -d --name replayhaven -p 8787:8787 \
            -e REPLAYHAVEN_ACCESS_TOKEN="$TOKEN" \
            -e REPLAYHAVEN_PUBLIC_ORIGIN=http://localhost:8787 \
            -e REPLAYHAVEN_CLIENT_DOWNLOAD_URL=https://example.invalid/ReplayHaven-Client-Setup.exe \
            replayhaven:ci
          for _ in $(seq 1 30); do
            if [ "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/api/status)" = "401" ]; then break; fi
            sleep 1
          done
          curl -fs -H "Authorization: Bearer $TOKEN" http://localhost:8787/api/status | grep -q '"clientDownloadAvailable":true'
          test "$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOKEN" http://localhost:8787/api/downloads/windows)" = "302"
          curl -fs http://localhost:8787/ | grep -q '<div id="root">'
          docker logs replayhaven
          docker rm -f replayhaven

  client:
    name: Windows client
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run client:prepare
      - name: Package unpacked client
        run: npx electron-builder --config electron-builder.yml --win dir --x64
      # The smoke test ends with a Playwright screenshot, which needs its browser installed.
      - run: npx playwright install chromium
      - name: Smoke test the client
        run: node scripts/client-smoke.mjs
