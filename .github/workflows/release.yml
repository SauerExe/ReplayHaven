name: Release

# Tag a commit as vX.Y.Z and push the tag. This builds the Windows installer,
# publishes the multi-arch server image to GHCR and creates the GitHub release.
# "Run workflow" starts a dry run: it builds the same things but publishes nothing.
on:
  push:
    tags: ['v*.*.*']
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  # Build provenance for the installer (Sigstore via GitHub), see the release notes.
  id-token: write
  attestations: write

env:
  # Only a version tag publishes the image and the release.
  PUBLISH: ${{ startsWith(github.ref, 'refs/tags/v') }}

jobs:
  client:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Version from tag
        if: env.PUBLISH == 'true'
        shell: bash
        run: echo "REPLAYHAVEN_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
      # The release job does the upload; electron-builder must never publish on its own.
      - run: npm run client:build -- --publish never
      # The installer is not code-signed; the attestation proves it was built by this workflow from
      # the tagged commit. Check it with: gh attestation verify <file> --repo <owner>/<repo>
      - name: Attest build provenance
        if: env.PUBLISH == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: release/ReplayHaven-Client-Setup.exe
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-client
          path: release/ReplayHaven-Client-Setup.exe
          if-no-files-found: error

  image:
    name: Server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image name and tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUBLISH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            REPLAYHAVEN_VERSION=${{ github.ref_name }}
            REPLAYHAVEN_CLIENT_DOWNLOAD_URL=https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ReplayHaven-Client-Setup.exe
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: GitHub release
    needs: [client, image]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-client
          path: assets
      - name: Prepare release assets
        run: |
          set -euo pipefail
          IMAGE="ghcr.io/${GITHUB_REPOSITORY,,}"
          # The dry run takes the version from package.json and pretends its tag exists.
          if [ "$PUBLISH" = true ]; then TAG="${GITHUB_REF_NAME}"; else TAG="v$(node -p "require('./package.json').version")"; fi
          VERSION="${TAG#v}"
          # Ready-to-run compose file, pinned to this release's image, plus the env template.
          sed -E "s#^( *image: ).*#\1${IMAGE}:${VERSION}#" compose.yaml > assets/compose.yaml
          grep -q "^ *image: ${IMAGE}:${VERSION}$" assets/compose.yaml
          cp .env.example assets/env.example
          # The one-line installer downloads compose.yaml and env.example from the same release
          # and checks them against SHA256SUMS.txt. It replaces setup-server.sh as a release asset;
          # that script now needs a source checkout (it shares install.sh's functions).
          cp install.sh assets/install.sh
          (cd assets && sha256sum ReplayHaven-Client-Setup.exe compose.yaml env.example install.sh > SHA256SUMS.txt)
          # This version's section from CHANGELOG.md goes at the top of the release notes.
          awk -v version="${VERSION}" '
            index($0, "## [" version "]") == 1 { found = 1; next }
            found && /^## \[/ { exit }
            found { print }
          ' CHANGELOG.md > assets/CHANGES.md
          {
            if [ -s assets/CHANGES.md ]; then
              echo "## What's new"
              cat assets/CHANGES.md
              echo
            fi
            echo "## Self-host the server"
            echo
            echo "On a host with Docker and the Compose plugin, this creates \`./replayhaven\`, starts the server"
            echo "and prints a link that creates your admin account. Run it again to update."
            echo
            echo '```bash'
            echo "curl -fsSL https://github.com/${GITHUB_REPOSITORY}/releases/latest/download/install.sh | bash"
            echo '```'
            echo
            echo "To install exactly this release, run it with \`REPLAYHAVEN_VERSION=${VERSION} bash\` instead of \`bash\`."
            echo "Or set it up by hand:"
            echo
            echo '```bash'
            echo "mkdir -p replayhaven && cd replayhaven"
            echo "curl -fsSLO https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/compose.yaml"
            echo "curl -fsSL  https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}/env.example -o .env"
            echo "# edit .env: REPLAYHAVEN_ACCESS_TOKEN (openssl rand -hex 24) and REPLAYHAVEN_PUBLIC_ORIGIN"
            echo "docker compose up -d"
            echo '```'
            echo
            echo "Image: \`${IMAGE}:${VERSION}\` (linux/amd64, linux/arm64)."
            echo
            echo "## Windows client"
            echo
            echo "Install \`ReplayHaven-Client-Setup.exe\` on the gaming PC, or download it later under Settings → Recording PCs on your server."
            echo "The installer is not code-signed yet, so Windows SmartScreen asks for confirmation."
            echo "To check that it was built by this repository's release workflow from this tag, compare it with SHA256SUMS.txt or run:"
            echo
            echo '```bash'
            echo "gh attestation verify ReplayHaven-Client-Setup.exe --repo ${GITHUB_REPOSITORY}"
            echo '```'
          } > assets/NOTES.md
      - uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        if: env.PUBLISH == 'true'
        with:
          body_path: assets/NOTES.md
          generate_release_notes: true
          files: |
            assets/ReplayHaven-Client-Setup.exe
            assets/compose.yaml
            assets/env.example
            assets/install.sh
            assets/SHA256SUMS.txt
      - name: Keep the probe's release assets
        if: env.PUBLISH != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-probe
          path: assets
          retention-days: 7
