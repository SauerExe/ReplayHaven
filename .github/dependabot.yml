version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Kleine Updates gebündelt; große Versionssprünge kommen einzeln, weil sie oft Codeänderungen brauchen.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Große npm-Versionen erst nach dem Umbau der Weboberfläche: Sie verlangen Änderungen an deren Dateien.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
