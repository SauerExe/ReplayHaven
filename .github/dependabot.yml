version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # Small updates grouped; major version jumps come one at a time because they often need code changes.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
    # Major npm versions only after the web UI rework: they require changes to its files.
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
