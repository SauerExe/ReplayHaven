<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>ReplayHaven social preview</title>
    <link rel="stylesheet" href="common.css" />
    <style>
      body {
        width: 1280px;
        height: 640px;
        overflow: hidden;
      }
      .stage {
        position: relative;
        width: 1280px;
        height: 640px;
        overflow: hidden;
        background:
          radial-gradient(760px 480px at 80% 30%, #a78bfa2e, transparent 70%),
          linear-gradient(180deg, #101017, #0b0b0f);
      }
      .copy {
        position: absolute;
        left: 72px;
        top: 76px;
        width: 560px;
      }
      .brand {
        font-size: 34px;
      }
      h1 {
        margin: 40px 0 24px;
        font-size: 72px;
        line-height: 1;
      }
      h1 em {
        font-style: normal;
        color: var(--accent);
      }
      p {
        margin: 0;
        font-size: 24px;
        line-height: 1.45;
        color: #c9c9d4;
      }
      img {
        position: absolute;
        left: 660px;
        top: 96px;
        width: 780px;
        height: 488px;
        border-radius: 14px;
        object-fit: cover;
        object-position: top left;
        box-shadow:
          0 40px 80px #000000a6,
          0 0 0 1px #ffffff1a;
      }
    </style>
  </head>
  <body>
    <div class="stage">
      <div class="copy">
        <div class="brand">
          <svg viewBox="0 0 32 34" aria-hidden="true">
            <path d="M8 6v22L28 17z" fill="currentColor" />
            <path d="M2 8v18" stroke="currentColor" stroke-width="3" />
          </svg>
          <span>Replay<b>Haven</b></span>
        </div>
        <h1 class="display">Game clips,<br />named by <em>local AI</em>.</h1>
        <p>
          Self-hosted archive with a Windows client, a Docker server and a cinematic web library.
        </p>
      </div>
      <img src="../app-home.jpg" alt="" />
    </div>
  </body>
</html>
